          <section>
            <h2>Professional Profile</h2>
            <p>Quantum chemist and architect of phase-space electronic structure theory. My research develops Quantum Boltzmann Equation (QBE) solvers that regularize mean-field singularities and scale the exponential walls of strongly correlated quantum matter. I direct Point Reyes Sound, Inc. where we build free energy optimizers for molecules and materials.</p>
          </section>

          <section>
            <h2>Skills &amp; Methodologies</h2>
            <ul>
              <li><strong>HPC (2012–now):</strong> Python, C++, MPI, Slurm, GPU Acceleration, Linux</li>
              <li><strong>Quantum Simulation (2012–now):</strong> FTQC, QEC, Quantum Boltzmann Equation (QBE)</li>
              <li><strong>Data Pipelines (2022–now):</strong> Vector Databases, ChromaDB, Azure</li>
              <li><strong>ML Infrastructure (2023–now):</strong> PyTorch, JAX, LLMs, LoRA</li>
            </ul>
          </section>

          <section>
            <h2>Experience</h2>
            <ul>
              <li><strong>June 2026:</strong> Founder &amp; CEO — Point Reyes Sound, Inc., San Francisco, CA</li>
              <li><strong>2024–2025:</strong> Senior Quantum Solutions Chemist — PsiQuantum, Palo Alto, CA, USA</li>
              <li><strong>2023–2024:</strong> Staff Researcher in Quantum AI — University of Chicago, Chicago, IL, USA</li>
              <li><strong>2017–2023:</strong> Postdoctoral Research Fellow — UC Berkeley &amp; LBNL, Berkeley, CA, USA</li>
            </ul>
          </section>

          <section>
            <h2>Education &amp; Academic Training</h2>
            <ul>
              <li><strong>University of Chicago (2012–2017):</strong> MS, Ph.D. in Theoretical and Computational Quantum Chemistry (Advisor: Prof. David A. Mazziotti)</li>
              <li><strong>Indian Institute of Technology Bombay (2009–2012):</strong> Master of Science in Chemistry</li>
              <li><strong>St. Stephen's College, University of Delhi (2006–2009):</strong> B.Sc. (Hons) in Chemistry, with Physics and Mathematics</li>
            </ul>
          </section>

          <section>
            <h2>Appointments</h2>
            <article>
              <h3>Founder &amp; CEO — Point Reyes Sound, Inc. (June 2026 – Present, San Francisco, CA)</h3>
              <ul>
                <li><strong>Phase-Space Electronic Structure:</strong> Formulated a Hessian-free orbital optimization framework utilizing continuous phase-space fluid advection and the Bhatnagar-Gross-Krook (BGK) collision operator to autonomously regularize mean-field singularities.</li>
                <li><strong>Quantum Boltzmann Entrainment Tensor (QBET):</strong> Developed a framework coupling classical phase-space relaxation to an active-space quantum core, circumventing combinatorial active-space expansion and demonstrating monotonic CASSCF orbital convergence on multireference dissociation benchmarks up to 254-orbital basis sets.</li>
                <li><strong>Solid-State k-Space Decoupling:</strong> Generalized the phase-space transport engine for periodic crystalline systems by projecting continuous Wigner distributions onto cGTOs, mapping multidimensional transport to decoupled matrix relaxations across the Brillouin zone.</li>
              </ul>
            </article>

            <article>
              <h3>Senior Quantum Solutions Chemist — PsiQuantum, Corp. (Oct 2024 – Mar 2025, Palo Alto, CA)</h3>
              <ul>
                <li>Translated quantum chemical models of correlated electron systems into algorithmic compilation pipelines and active-space resource estimation frameworks for fault-tolerant quantum hardware architectures.</li>
              </ul>
            </article>

            <article>
              <h3>Staff Researcher in Quantum AI — University of Chicago (Nov 2023 – Oct 2024, Chicago, IL)</h3>
              <ul>
                <li><strong>Physics-Grounded Generative Workflows:</strong> Led the development of an equivariant framework conditioning generative models on exact physical invariants (molecular geometry, charge/spin multiplicity, point-group symmetry) to mitigate out-of-distribution mode collapse.</li>
                <li><strong>Physical Symmetry Integration:</strong> Integrated point-group and rotational symmetries into multimodal foundation models, securing Microsoft Azure Accelerate Foundation Models Research funding for automated quantum chemical discovery.</li>
                <li><strong>Structural Verification Metrics:</strong> Designed deterministic validation protocols for synthetic molecular configurations, evaluating model fidelity against exact graph automorphisms and quantum chemical invariant sets rather than heuristic approximations.</li>
              </ul>
            </article>

            <article>
              <h3>Postdoctoral Research Fellow — UC Berkeley &amp; Lawrence Berkeley National Laboratory (2017 – 2023, Berkeley, CA)</h3>
              <ul>
                <li><strong>MOF Chemistry:</strong> Modeled dihydrogen binding and multi-ligand coordination at open metal sites (V(II), Cu(I)) in metal-organic frameworks under Prof. Martin Head-Gordon, validating predictions against experimental neutron scattering and adsorption isotherms (JACS, PCCP Hot Article).</li>
                <li><strong>Quantum Chemistry Software:</strong> Co-developed modular quantum chemistry capabilities for open-shell and correlated electronic structure as a code contributor to the open-source Q-Chem 5 package (J. Chem. Phys.).</li>
              </ul>
            </article>
